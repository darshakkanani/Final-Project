<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer - Smart Image Processing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="window-controls">
                <span class="control minimize"></span>
                <span class="control maximize"></span>
                <span class="control close"></span>
            </div>
            <h1 class="app-title"> Image Resizer</h1>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h1 class="page-title">Smart Image Resizing</h1>
            
            <!-- Upload Section -->
            <div class="section upload-section">
                <h2 class="section-title">Upload Image</h2>
                <div class="section-content">
                    <label for="file-input" class="file-label">Select your image:</label>
                    <div class="file-input-container">
                        <input type="file" id="file-input" accept="image/*" style="display: none;">
                        <input type="text" id="file-display" placeholder="No file selected" readonly>
                        <button type="button" id="choose-btn" onclick="document.getElementById('file-input').click()">Choose</button>
                    </div>
                    <button type="button" id="start-btn" onclick="processImage()">Resize Image</button>
                    
                    <!-- Loading indicator -->
                    <div id="loading" class="loading" style="display: none;">
                        <div class="spinner"></div>
                        <p>Resizing image...</p>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div class="section results-section">
                <h2 class="section-title">Results</h2>
                <div class="section-content">
                    <!-- Image display area -->
                    <div id="image-display" class="image-display" style="display: none;">
                        <div class="image-comparison">
                            <div class="image-item">
                                <h4>Original Image</h4>
                                <img id="original-image" src="" alt="Original image">
                                <p id="original-info" class="image-info"></p>
                            </div>
                            <div class="image-item">
                                <h4>Resized Image (380x380)</h4>
                                <img id="resized-image" src="" alt="Resized image">
                                <p id="resize-info" class="image-info"></p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Error display -->
                    <div id="error-message" class="error-message" style="display: none;"></div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p> 2024 Image Resizer - Smart Image Processing</p>
        </div>
    </div>

    <script>
        // Update file display when file is selected
        document.getElementById('file-input').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : 'No file selected';
            document.getElementById('file-display').value = fileName;
        });

        async function processImage() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select an image file first!');
                return;
            }

            // Show loading, hide results
            document.getElementById('loading').style.display = 'block';
            document.getElementById('image-display').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                // Hide loading
                document.getElementById('loading').style.display = 'none';

                if (result.success) {
                    // Display both original and resized images
                    document.getElementById('original-image').src = result.original_image;
                    document.getElementById('resized-image').src = result.resized_image;
                    document.getElementById('original-info').textContent = 
                        `Size: ${result.original_size}`;
                    document.getElementById('resize-info').textContent = 
                        `Size: ${result.resized_size} (Resized)`;
                    document.getElementById('image-display').style.display = 'block';
                } else {
                    // Display error
                    document.getElementById('error-message').textContent = result.error;
                    document.getElementById('error-message').style.display = 'block';
                }
            } catch (error) {
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                
                // Display error
                document.getElementById('error-message').textContent = 'Network error: ' + error.message;
                document.getElementById('error-message').style.display = 'block';
            }
        }
    </script>
</body>
</html>
